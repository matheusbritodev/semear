# Render Blueprint: API Java do Sistema Semear (New > Blueprint > escolher este repositório).
# Variáveis com "sync: false" são pedidas na criação: copie os valores do seu .env (nunca do repositório).
services:
  - type: web
    name: semear-api
    runtime: docker
    plan: free
    region: oregon            # mesma região do banco no Supabase (us-west-2)
    healthCheckPath: /api/saude
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CORS_ORIGENS     # endereço da View na Vercel, ex.: https://semear.vercel.app
        sync: false
      - key: CORA_MODO
        value: falso
      - key: CORA_WEBHOOK_SEGREDO
        generateValue: true
      - key: SEMEAR_JOBS_ATIVOS
        value: "true"
      - key: DB_POOL_MAX
        value: "5"
      - key: SPRINGDOC_API_DOCS_ENABLED
        value: "false"
      - key: SPRINGDOC_SWAGGER_UI_ENABLED
        value: "false"
